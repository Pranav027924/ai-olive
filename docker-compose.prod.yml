# Production-style stack (PRD §9.9).
#
# Brings up infra + all app services from the per-service Dockerfiles,
# with healthchecks, dependency ordering, resource limits, and one-shot
# migration jobs. Intended for a single-host deploy or a local
# production rehearsal; the Kubernetes manifests (k8s/) are the real
# cluster target.
#
#   cp .env.example .env   # then set real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required .env values for production: DISABLE_AUTH=false, a >=32-byte
# JWT_SECRET, INGESTION_API_KEYS, and the provider API keys you use.

name: ai-olive-prod

x-restart: &restart unless-stopped

# S3-compatible object storage for chat attachments. RustFS replaces MinIO,
# whose community images were removed from Docker Hub and gated on Quay in 2026.
# The same image provides the server and the `rc` CLI used by createbuckets.
x-rustfs-image: &rustfs-image rustfs/rustfs:1.0.5

services:
  # ---------------------------------------------------------------- infra
  postgres:
    image: postgres:16-alpine
    restart: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-olive}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olive} -d ${POSTGRES_DB:-olive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  redis:
    image: redis:7-alpine
    restart: *restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  rustfs:
    image: *rustfs-image
    restart: *restart
    # The .env keeps the MINIO_ROOT_* names so existing setups need no changes.
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-olive}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      RUSTFS_OBS_LOG_DIRECTORY: ""   # log to stdout (docker logs), not files in the container
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  clickhouse:
    image: clickhouse/clickhouse-server:24.10-alpine
    restart: *restart
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-olive}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-olive}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # GET (not --spider/HEAD): ClickHouse /ping answers GET with "Ok.".
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping 2>&1 | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }

  # ---------------------------------------------- one-shot init (run once)
  createbuckets:
    image: *rustfs-image
    restart: "no"
    # rc reads the target from RC_HOST_<alias>. Credentials sit in a URL here,
    # so they must be URL-safe (e.g. `openssl rand -hex 24`).
    entrypoint: ["/usr/bin/rc"]
    command: ["bucket", "create", "s3/${S3_BUCKET:-olive-attachments}", "--ignore-existing"]
    environment:
      RC_HOST_s3: "http://${MINIO_ROOT_USER:-olive}:${MINIO_ROOT_PASSWORD}@rustfs:9000"
    depends_on:
      rustfs: { condition: service_healthy }

  clickhouse-migrate:
    image: curlimages/curl:8.11.0
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        curl --fail --silent --show-error \
          --user "${CLICKHOUSE_USER:-olive}:${CLICKHOUSE_PASSWORD}" \
          --data-binary @- "http://clickhouse:8123/?database=${CLICKHOUSE_DB:-olive}" <<'SQL'
        CREATE TABLE IF NOT EXISTS inference_metrics
        (
            event_id UUID, session_id UUID,
            provider LowCardinality(String), model LowCardinality(String),
            status LowCardinality(String),
            started_at DateTime64(3,'UTC'), finished_at DateTime64(3,'UTC'),
            latency_ms UInt32, ttft_ms Nullable(UInt32),
            prompt_tokens UInt32, completion_tokens UInt32, cost_usd Float64
        )
        ENGINE = MergeTree
        PARTITION BY toYYYYMM(started_at)
        ORDER BY (provider, model, started_at, event_id)
        TTL toDateTime(started_at) + INTERVAL 180 DAY;
        SQL
    depends_on:
      clickhouse: { condition: service_healthy }

  # ----------------------------------------------------------- migrations
  chat-migrate:
    build: { context: ., dockerfile: docker/chat-service.Dockerfile }
    image: ai-olive/chat-service:latest
    restart: "no"
    command: ["sh", "-c", "cd /app/chat-service && alembic upgrade head"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres: { condition: service_healthy }

  worker-migrate:
    build: { context: ., dockerfile: docker/worker-service.Dockerfile }
    image: ai-olive/worker-service:latest
    restart: "no"
    command: ["sh", "-c", "cd /app/worker-service && alembic upgrade head"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres: { condition: service_healthy }

  # ------------------------------------------------------------- services
  chat-service:
    build: { context: ., dockerfile: docker/chat-service.Dockerfile }
    image: ai-olive/chat-service:latest
    restart: *restart
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT_URL: http://rustfs:9000
      INGESTION_URL: http://ingestion-service:8001/v1/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rustfs: { condition: service_healthy }
      chat-migrate: { condition: service_completed_successfully }
      createbuckets: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  ingestion-service:
    build: { context: ., dockerfile: docker/ingestion-service.Dockerfile }
    image: ai-olive/ingestion-service:latest
    restart: *restart
    env_file: .env
    environment:
      REDIS_HOST: redis
    ports:
      - "8001:8001"
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  worker-service:
    build: { context: ., dockerfile: docker/worker-service.Dockerfile }
    image: ai-olive/worker-service:latest
    restart: *restart
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      worker-migrate: { condition: service_completed_successfully }
      clickhouse-migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  dashboard-service:
    build: { context: ., dockerfile: docker/dashboard-service.Dockerfile }
    image: ai-olive/dashboard-service:latest
    restart: *restart
    env_file: .env
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
    ports:
      - "8004:8004"
    depends_on:
      clickhouse: { condition: service_healthy }
      clickhouse-migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  ui:
    build: { context: ., dockerfile: docker/ui.Dockerfile }
    image: ai-olive/ui:latest
    restart: *restart
    ports:
      - "8080:8080"
    depends_on:
      - chat-service
      - dashboard-service
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  clickhouse_data:
