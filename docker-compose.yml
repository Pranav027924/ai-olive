# Local development stack.
# Postgres, Redis, and RustFS (S3-compatible object storage) per PRD Phase 0.3.
# RustFS replaces MinIO, whose community images were removed from Docker Hub
# and gated on Quay in 2026.
# ClickHouse is added in Phase 7.4 (and switched on via the `analytics` profile).
#
# Bring up: `make up`  (or: docker compose up -d)
# Tear down: `make down` (or: docker compose down)
# Logs:     docker compose logs -f <service>
#
# All services bind to 127.0.0.1 only — never expose them to the LAN by default.

name: ai-olive

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-olive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olive_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-olive}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olive} -d ${POSTGRES_DB:-olive}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: ai-olive-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.5
    container_name: ai-olive-rustfs
    restart: unless-stopped
    # The .env keeps the MINIO_ROOT_* names; S3_ACCESS_KEY/S3_SECRET_KEY must match them.
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-olive}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-olive_dev_pw_minio}
      RUSTFS_OBS_LOG_DIRECTORY: ""   # log to stdout (docker logs), not files in the container
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Web console: http://127.0.0.1:9001/rustfs/console/
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: create the attachments bucket (idempotent), then exit 0.
  createbuckets:
    image: rustfs/rustfs:1.0.5
    container_name: ai-olive-createbuckets
    restart: "no"
    entrypoint: ["/usr/bin/rc"]
    command: ["bucket", "create", "s3/${S3_BUCKET:-olive-attachments}", "--ignore-existing"]
    environment:
      RC_HOST_s3: "http://${MINIO_ROOT_USER:-olive}:${MINIO_ROOT_PASSWORD:-olive_dev_pw_minio}@rustfs:9000"
    depends_on:
      rustfs: { condition: service_healthy }

  # ClickHouse (Phase 7.4). Off by default; enable with `make up-analytics` or
  # `docker compose --profile analytics up -d`.
  clickhouse:
    image: clickhouse/clickhouse-server:24.10-alpine
    container_name: ai-olive-clickhouse
    restart: unless-stopped
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-olive}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-olive}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-olive_dev_pw_ch}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"   # HTTP
      - "127.0.0.1:9009:9000"   # native TCP (host 9009 to avoid the RustFS :9000 collision)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # GET (not --spider/HEAD): ClickHouse /ping answers GET with "Ok.".
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping 2>&1 | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  clickhouse_data:
