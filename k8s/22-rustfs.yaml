# S3-compatible object storage for chat attachments. RustFS replaces MinIO,
# whose community images were removed from Docker Hub and gated on Quay in 2026.
# The bucket is created by the createbuckets Job in 30-migrations.yaml.
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: ai-olive
spec:
  selector: { app: rustfs }
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: ai-olive
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels: { app: rustfs }
  template:
    metadata:
      labels: { app: rustfs }
    spec:
      # The image runs as uid/gid 10001; fsGroup makes the PVC writable for it.
      securityContext:
        fsGroup: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.5
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            # Root creds mirror the S3_* values the apps use.
            - name: RUSTFS_ACCESS_KEY
              valueFrom: { configMapKeyRef: { name: olive-config, key: S3_ACCESS_KEY } }
            - name: RUSTFS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: olive-secrets, key: S3_SECRET_KEY } }
            # Log to stdout (kubectl logs), not files inside the container.
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ""
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 10Gi }
